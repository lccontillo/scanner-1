[package]
name = "scanner"
version = "0.1.0"
edition = "2024"

[lib]
path = "src-rs/lib.rs"
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2.88"

# Keep web-sys but remove ImageData unless you still use it for tests
web-sys = { version = "0.3", features = ["Performance"] }

# Required for decoding PNG/JPEG from Uint8Array
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3   # 3 is ok, or you can use "s" to shrink size
lto = true
